name: Проверка прогнозов

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Тесты скоринга
        run: python tests/test_score.py

      - name: Формат прогнозов и обязательные поля
        run: python scripts/score.py --json
